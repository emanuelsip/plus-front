version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plus-events-frontend
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
      - VITE_SANCTUM_CSRF_URL=${VITE_SANCTUM_CSRF_URL:-http://localhost:8000/sanctum/csrf-cookie}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-true}
    networks:
      - plus-network
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  plus-network:
    driver: bridge

volumes:
  node_modules:
    driver: local

